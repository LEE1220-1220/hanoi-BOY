<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하노이 골목 · 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F4EEE1; --card:#FFFDF8; --ink:#241F18; --muted:#6E655A; --line:#E6DCC9;
  --jade:#1E5E4E; --jade-dk:#164A3D; --jade-soft:#E7F0EA; --orange:#D98026; --red:#B23B4E;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}

.top{background:var(--jade-dk);color:#EAF3EE;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.top-l{display:flex;align-items:center;gap:12px;}
.top-mark{width:38px;height:38px;border-radius:10px;background:var(--jade);color:#F4EEE1;font-family:'Gowun Batang',serif;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;}
.top-title{font-family:'Gowun Batang',serif;font-weight:700;font-size:18px;}
.top-title small{display:block;font-family:'Noto Sans KR';font-weight:400;font-size:11px;opacity:.8;}
.top-r{display:flex;gap:8px;align-items:center;}
.top-btn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#EAF3EE;font-size:13px;font-weight:500;padding:7px 13px;border-radius:8px;cursor:pointer;text-decoration:none;}
.top-btn:hover{background:rgba(255,255,255,.1);}

.wrap{max-width:920px;margin:0 auto;padding:20px 18px 120px;}
.warn{background:#FBF1E0;border:1px solid #EAD6AE;color:#7A5B1E;font-size:12.5px;border-radius:10px;padding:11px 14px;margin-bottom:14px;}
.srcbar{font-size:12px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.pill.local{background:#EDE3CF;color:#6E5A2E;}
.pill.cloud{background:var(--jade-soft);color:var(--jade);}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;}
.tab.on{background:var(--jade);border-color:var(--jade);color:#fff;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.panel-head h2{margin:0;font-family:'Gowun Batang',serif;font-size:20px;}
.panel-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
.addbtn{border:none;background:var(--jade);color:#fff;font-weight:700;font-size:13.5px;padding:9px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.addbtn:hover{opacity:.92;}

.row{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px;background:#FFFEFB;}
.row-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.swatch{width:40px;height:40px;border-radius:8px;flex:none;box-shadow:inset 0 0 12px rgba(0,0,0,.12);background-size:cover;background-position:center;}
.row-idx{font-size:12px;color:var(--muted);font-weight:700;}
.row-ctrls{margin-left:auto;display:flex;gap:5px;}
.ic{border:1px solid var(--line);background:var(--card);color:var(--muted);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.ic:hover{border-color:var(--jade);color:var(--jade);}
.ic.del:hover{border-color:var(--red);color:var(--red);}
.ic:disabled{opacity:.35;cursor:default;}
.grid{display:grid;gap:9px;}
.g2{grid-template-columns:1fr 1fr;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld label{font-size:11px;font-weight:700;color:var(--muted);}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13.5px;background:#fff;color:var(--ink);width:100%;}
.fld textarea{resize:vertical;min-height:38px;}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:transparent;}

/* 이미지 컨트롤 */
.img-box{display:flex;gap:12px;align-items:center;margin-top:9px;padding-top:11px;border-top:1px dashed var(--line);}
.img-prev{width:104px;height:58px;border-radius:8px;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 10px rgba(0,0,0,.15);position:relative;}
.img-prev .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.5);}
.img-actions{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.img-urlrow{display:flex;gap:6px;}
.img-urlrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:0;}
.img-btns{display:flex;gap:6px;flex-wrap:wrap;}
.mini{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:700;padding:7px 11px;border-radius:7px;cursor:pointer;}
.mini:hover{border-color:var(--jade);color:var(--jade);}
.mini.rm:hover{border-color:var(--red);color:var(--red);}

.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1E9D8;gap:14px;}
.set-row:last-child{border-bottom:none;}
.set-row .k{font-weight:700;font-size:14px;}
.set-row .k small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;}
.switch{position:relative;width:46px;height:26px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#CFC6B4;border-radius:999px;cursor:pointer;transition:.2s;}
.slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked+.slider{background:var(--jade);}
.switch input:checked+.slider::before{transform:translateX(20px);}
.num{width:90px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;}
.pw-row{display:flex;gap:8px;flex-wrap:wrap;}
.pw-row input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;}
.smallbtn{border:1px solid var(--jade);background:transparent;color:var(--jade);font-weight:700;font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer;}
.smallbtn:hover{background:var(--jade);color:#fff;}
.codebox{background:#23201B;color:#DCE9E2;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;padding:12px 14px;border-radius:10px;overflow:auto;white-space:pre;margin-top:8px;}

.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px;z-index:30;}
.savebar-in{max-width:920px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.dirty{font-size:12.5px;color:var(--muted);}
.dirty.on{color:var(--orange);font-weight:700;}
.save-actions{display:flex;gap:8px;}
.save-btn{border:none;background:var(--jade);color:#fff;font-weight:700;font-size:14.5px;padding:11px 22px;border-radius:9px;cursor:pointer;box-shadow:0 3px 0 rgba(20,66,54,.4);}
.save-btn:hover{transform:translateY(-1px);}
.save-btn:disabled{opacity:.6;cursor:default;transform:none;}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;font-size:13.5px;padding:11px 16px;border-radius:9px;cursor:pointer;}
.ghost:hover{border-color:var(--red);color:var(--red);}

.gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);}
.gate-mark{width:52px;height:52px;border-radius:13px;background:var(--jade);color:#F4EEE1;font-family:'Gowun Batang',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.gate-card h1{font-family:'Gowun Batang',serif;font-size:21px;margin:0 0 4px;}
.gate-card p{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
.gate-card input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14px;margin-bottom:10px;}
.gate-card input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:transparent;}
.gate-card button{width:100%;border:none;background:var(--jade);color:#fff;font-weight:700;font-size:15px;padding:12px;border-radius:9px;cursor:pointer;}
.gate-err{color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:6px;}
.gate-hint{font-size:11.5px;color:#9C9384;margin-top:12px;}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:var(--jade-dk);color:#EAF3EE;font-size:13.5px;padding:11px 20px;border-radius:999px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:560px){ .g2{grid-template-columns:1fr;} .top-title small{display:none;} .img-box{flex-direction:column;align-items:stretch;} .img-prev{width:100%;height:120px;} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">골목</div>
    <h1>관리자 로그인</h1>
    <p>관리자 비밀번호를 입력하세요.</p>
    <div class="gate-err" id="gateErr"></div>
    <input id="gatePw" type="password" placeholder="관리자 비밀번호" autocomplete="off" />
    <div id="gateSb" style="display:none">
      <input id="gateEmail" type="email" placeholder="Supabase 관리자 이메일" autocomplete="username" />
      <input id="gateSbPw" type="password" placeholder="Supabase 관리자 비밀번호" autocomplete="current-password" />
    </div>
    <button id="gateBtn">로그인</button>
    <div class="gate-hint" id="gateHint">관리자만 접속 가능합니다.</div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div class="top-l">
      <div class="top-mark">골목</div>
      <div class="top-title">관리자 페이지<small>하노이 골목</small></div>
    </div>
    <div class="top-r">
      <a class="top-btn" href="index.html" target="_blank">메인 보기 ↗</a>
      <button class="top-btn" id="logout">로그아웃</button>
    </div>
  </div>

  <div class="wrap">
    <div class="warn" id="warnBox"></div>
    <div class="srcbar">저장 위치: <span class="pill" id="srcPill"></span> <span id="srcText"></span></div>

    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>

  <div class="savebar">
    <div class="savebar-in">
      <span class="dirty" id="dirty">저장된 상태</span>
      <div class="save-actions">
        <button class="ghost" id="resetBtn">기본값으로 되돌리기</button>
        <button class="save-btn" id="saveBtn">변경사항 저장</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" />
<div class="toast" id="toast"></div>

<script>

const clone=o=>JSON.parse(JSON.stringify(o));
const hasCloud=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);
// 관리자가 Supabase에 로그인하면 받는 토큰(있으면 설정 저장 권한이 생김)
let SB_TOKEN=null;
const sbHeaders=(auth)=>({apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+((auth&&SB_TOKEN)?SB_TOKEN:SUPABASE_ANON_KEY)});

// Supabase Auth: 이메일+비밀번호로 로그인 → 액세스 토큰 획득
async function sbSignIn(email,password){
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
    method:"POST", headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,password})
  });
  if(!r.ok) return null;
  const d=await r.json(); return d.access_token||null;
}

// Supabase Storage: 이미지 파일 업로드 → 공개 URL 반환 (images 버킷)
async function sbUploadImage(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path="banners/"+Date.now()+"_"+Math.floor(Math.random()*99999)+"."+ext;
  const r=await fetch(SUPABASE_URL+"/storage/v1/object/images/"+path,{
    method:"POST",
    headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+(SB_TOKEN||SUPABASE_ANON_KEY),"Content-Type":file.type||"image/jpeg","x-upsert":"true"},
    body:file
  });
  if(!r.ok) return null;
  return SUPABASE_URL+"/storage/v1/object/public/images/"+path;
}

async function dbLoad(){
  if(hasCloud){
    try{
      const r=await fetch(SUPABASE_URL+"/rest/v1/hg_site?id=eq.1&select=config",{headers:sbHeaders()});
      if(r.ok){ const rows=await r.json(); if(rows&&rows[0]&&rows[0].config) return {config:rows[0].config,source:"cloud"}; }
    }catch(e){ console.warn("cloud load fail",e); }
  }
  try{const v=localStorage.getItem("hg_config"); if(v) return {config:JSON.parse(v),source:"local"};}catch(e){}
  return {config:null,source:"default"};
}
async function dbSave(config){
  try{localStorage.setItem("hg_config",JSON.stringify(config));}catch(e){}
  if(hasCloud){
    if(!SB_TOKEN) return {ok:false,cloud:true,noauth:true};
    try{
      const r=await fetch(SUPABASE_URL+"/rest/v1/hg_site",{
        method:"POST",
        headers:Object.assign(sbHeaders(true),{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),
        body:JSON.stringify({id:1,config})
      });
      return {ok:r.ok,cloud:true,status:r.status};
    }catch(e){ return {ok:false,cloud:true,err:e}; }
  }
  return {ok:true,cloud:false};
}

const ADMIN_PW = "5608";
const SESS="hg_admin_ok";
const getPw=()=>ADMIN_PW;
// 클라우드 연결 시: Supabase 관리자 로그인 칸을 보여줌
if(hasCloud){
  document.getElementById("gateSb").style.display="block";
  document.getElementById("gateHint").innerHTML="관리자만 접속 가능합니다. (관리자 비밀번호 + Supabase 관리자 계정으로 로그인)";

document.getElementById("gateBtn").onclick=tryLogin;
["gatePw","gateEmail","gateSbPw"].forEach(id=>{ const e=document.getElementById(id); if(e)e.addEventListener("keydown",ev=>{ if(ev.key==="Enter") tryLogin(); }); });
async function tryLogin(){
  const err=document.getElementById("gateErr");
  if(document.getElementById("gatePw").value!==getPw()){ err.textContent="관리자 비밀번호가 올바르지 않습니다."; return; }
  if(hasCloud){
    const email=document.getElementById("gateEmail").value.trim();
    const pw=document.getElementById("gateSbPw").value;
    if(!email||!pw){ err.textContent="Supabase 관리자 이메일과 비밀번호를 입력하세요."; return; }
    const btn=document.getElementById("gateBtn"); btn.disabled=true; btn.textContent="로그인 중…";
    SB_TOKEN=await sbSignIn(email,pw);
    btn.disabled=false; btn.textContent="로그인";
    if(!SB_TOKEN){ err.textContent="Supabase 로그인 실패 — 이메일·비밀번호를 확인하세요."; return; }
  }
  sessionStorage.setItem(SESS,"1"); startApp();
}
document.getElementById("logout").onclick=()=>{ sessionStorage.removeItem(SESS); SB_TOKEN=null; location.reload(); };
// 클라우드 모드에서는 새로고침 시 토큰이 없으므로 매번 다시 로그인 (로컬 모드는 세션 유지)
if(!hasCloud && sessionStorage.getItem(SESS)==="1"){ startApp(); }

async function startApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  const loaded=await dbLoad();
  data=clone(DEFAULTS);
  if(loaded.config) for(const k in DEFAULTS){ if(loaded.config[k]!=null) data[k]=loaded.config[k]; }
  // 서버 미설정 시 예전 개별 키가 있으면 흡수(하위호환)
  if(!loaded.config){ ["banners","settings","hot","notices","gallery"].forEach(k=>{ try{const v=localStorage.getItem("hg_"+k); if(v) data[k]=JSON.parse(v);}catch(e){} }); }
  // 메뉴 하위 항목(게시판)을 {id,label}로 정규화 — id는 글 데이터 연결용
  (data.nav||[]).forEach((n,gi)=>{ n.children=(n.children||[]).map((c,ci)=> (c&&typeof c==="object")?{id:c.id||("b_"+gi+"_"+ci),label:c.label}:{id:"b_"+gi+"_"+ci,label:c}); });
  // 저장 위치 표시
  const pill=document.getElementById("srcPill"), st=document.getElementById("srcText");
  if(hasCloud){ pill.className="pill cloud"; pill.textContent="Supabase(클라우드)"; st.textContent="모든 방문자에게 반영됩니다."; }
  else{ pill.className="pill local"; pill.textContent="이 브라우저"; st.textContent="변경 내용이 이 브라우저에만 저장됩니다."; }
  document.getElementById("warnBox").innerHTML = hasCloud
    ? "☁️ Supabase가 연결되어 있습니다. 저장하면 모든 방문자에게 반영됩니다."
    : "⚠️ 서버가 아직 연결되지 않았습니다. 지금은 변경 내용이 <b>이 브라우저에만</b> 저장됩니다. 모든 방문자에게 반영하려면 설정 탭의 안내대로 Supabase를 연결하세요.";
  renderTabs(); switchTab("site"); updateDirty();
}

// 탭
const TABS=[["site","제목·소개"],["banners","배너"],["hero","히어로"],["nav","메뉴"],["notices","공지글"],["hot","인기글"],["gallery","사진첩"],["settings","설정"]];
function renderTabs(){
  const t=document.getElementById("tabs"); t.innerHTML="";
  TABS.forEach(([id,label])=>{ const b=document.createElement("button"); b.className="tab"+(id===curTab?" on":""); b.textContent=label; b.onclick=()=>switchTab(id); t.appendChild(b); });
}
function switchTab(id){ curTab=id; renderTabs(); renderPanel(); }

// 공통 위젯
function gradSelect(val,onChange){
  const s=document.createElement("select");
  GRADS.forEach(g=>{ const o=document.createElement("option"); o.value=g.v; o.textContent=g.label; if(g.v===val)o.selected=true; s.appendChild(o); });
  if(!GRADS.some(g=>g.v===val)){ const o=document.createElement("option"); o.value=val; o.textContent="현재 색상"; o.selected=true; s.appendChild(o); }
  s.onchange=()=>onChange(s.value); return s;
}
function ctrlBtns(arr,i){
  const wrap=document.createElement("div"); wrap.className="row-ctrls";
  const up=document.createElement("button"); up.className="ic"; up.textContent="↑"; up.disabled=i===0;
  up.onclick=()=>{ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; markDirty(); renderPanel(); };
  const dn=document.createElement("button"); dn.className="ic"; dn.textContent="↓"; dn.disabled=i===arr.length-1;
  dn.onclick=()=>{ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; markDirty(); renderPanel(); };
  const del=document.createElement("button"); del.className="ic del"; del.textContent="✕";
  del.onclick=()=>{ if(confirm("이 항목을 삭제할까요?")){ arr.splice(i,1); markDirty(); renderPanel(); } };
  wrap.append(up,dn,del); return wrap;
}
function field(label,val,onInput,type){
  const f=document.createElement("div"); f.className="fld";
  const l=document.createElement("label"); l.textContent=label;
  const inp=document.createElement("input"); inp.value=val==null?"":val; if(type)inp.type=type;
  inp.oninput=()=>onInput(type==="number"?(+inp.value||0):inp.value);
  f.append(l,inp); return f;
}
function textareaField(label,val,onInput){
  const f=document.createElement("div"); f.className="fld";
  const l=document.createElement("label"); l.textContent=label;
  const ta=document.createElement("textarea"); ta.value=val||""; ta.oninput=()=>onInput(ta.value);
  f.append(l,ta); return f;
}

// 이미지 컨트롤 (배너/사진첩 공용)
function imageControl(item, sizeHint){
  const box=document.createElement("div"); box.className="img-box";
  const prev=document.createElement("div"); prev.className="img-prev";
  if(item.img){ prev.style.backgroundImage=`url('${item.img}')`; }
  else{ prev.style.background=item.g; prev.innerHTML=`<span class="ph">이미지 없음(색상)</span>`; }
  const actions=document.createElement("div"); actions.className="img-actions";
  const urlrow=document.createElement("div"); urlrow.className="img-urlrow";
  const urlInp=document.createElement("input"); urlInp.placeholder="이미지 주소(URL) 붙여넣기"; urlInp.value=item.img&&/^https?:/.test(item.img)?item.img:"";
  const urlBtn=document.createElement("button"); urlBtn.className="mini"; urlBtn.textContent="적용";
  urlBtn.onclick=()=>{ item.img=urlInp.value.trim(); markDirty(); renderPanel(); };
  urlrow.append(urlInp,urlBtn);
  const btns=document.createElement("div"); btns.className="img-btns";
  const fileBtn=document.createElement("button"); fileBtn.className="mini"; fileBtn.textContent="파일 업로드";
  fileBtn.onclick=()=>{ pendingFile=item; document.getElementById("fileInput").click(); };
  const rmBtn=document.createElement("button"); rmBtn.className="mini rm"; rmBtn.textContent="이미지 제거"; rmBtn.disabled=!item.img;
  rmBtn.onclick=()=>{ item.img=""; markDirty(); renderPanel(); };
  btns.append(fileBtn,rmBtn);
  const hint=document.createElement("div"); hint.style.cssText="font-size:11px;color:#9C9384;";
  hint.innerHTML=(sizeHint?`<b style="color:var(--jade)">권장 크기 ${sizeHint}</b> · `:"")+"이미지가 있으면 색상 대신 이미지가 보입니다. 파일은 500KB 이하 권장.";
  actions.append(urlrow,btns,hint);
  box.append(prev,actions); return box;
}
// 파일 업로드 처리 (클라우드: Storage 업로드 → URL / 로컬: base64)
document.getElementById("fileInput").addEventListener("change",async function(){
  const file=this.files&&this.files[0]; this.value="";
  if(!file||!pendingFile) return;
  const target=pendingFile; pendingFile=null;
  if(hasCloud){
    if(file.size>5000000){ toast("이미지가 너무 큽니다(5MB 초과)."); return; }
    toast("이미지 업로드 중…");
    const url=await sbUploadImage(file);
    if(url){ target.img=url; markDirty(); renderPanel(); toast("이미지가 업로드되었습니다."); }
    else{ toast("업로드 실패 — Storage에 public 'images' 버킷이 있는지, 로그인했는지 확인하세요."); }
  }else{
    if(file.size>1200000){ toast("이미지가 너무 큽니다(1.2MB 초과). 더 작은 파일을 사용하거나 서버를 연결하세요."); return; }
    const rd=new FileReader();
    rd.onload=()=>{ target.img=rd.result; markDirty(); renderPanel(); toast("이미지가 적용되었습니다."); };
    rd.readAsDataURL(file);
  }
});

function renderList(p,cfg){
  p.innerHTML="";
  const panel=document.createElement("div"); panel.className="panel";
  const head=document.createElement("div"); head.className="panel-head";
  head.innerHTML=`<div><h2>${cfg.title}</h2><p>${cfg.desc}</p></div>`;
  const add=document.createElement("button"); add.className="addbtn"; add.textContent="+ "+cfg.addLabel;
  add.onclick=()=>{ cfg.arr.push(cfg.make()); markDirty(); renderPanel(); };
  head.appendChild(add); panel.appendChild(head);
  if(cfg.arr.length===0){ const e=document.createElement("p"); e.style.cssText="color:#9C9384;font-size:13px;padding:10px 0;"; e.textContent="항목이 없습니다. 위 버튼으로 추가하세요."; panel.appendChild(e); }
  cfg.arr.forEach((item,i)=>{
    const row=document.createElement("div"); row.className="row";
    const top=document.createElement("div"); top.className="row-top";
    const sw=cfg.swatch(item);
    if(sw){ const s=document.createElement("div"); s.className="swatch"; s.style.cssText=sw; top.appendChild(s); }
    const idx=document.createElement("span"); idx.className="row-idx"; idx.textContent="#"+(i+1); top.appendChild(idx);
    top.appendChild(ctrlBtns(cfg.arr,i));
    row.appendChild(top); row.appendChild(cfg.body(item)); panel.appendChild(row);
  });
  p.appendChild(panel);
}

function renderSite(p){
  p.innerHTML="";
  const panel=document.createElement("div"); panel.className="panel";
  panel.innerHTML=`<div class="panel-head"><div><h2>제목 · 소개</h2><p>사이트 제목과 한 줄 소개를 직접 수정할 수 있습니다. 상단 로고 옆과 브라우저 탭에 표시됩니다.</p></div></div>`;
  const wrap=document.createElement("div"); wrap.className="row";
  wrap.appendChild(field("사이트 제목",data.siteTitle,v=>{data.siteTitle=v;markDirty();}));
  const sub=field("한 줄 소개",data.siteSub,v=>{data.siteSub=v;markDirty();}); sub.style.marginTop="10px";
  wrap.appendChild(sub);
  panel.appendChild(wrap);
  p.appendChild(panel);
}

function renderSettings(p){
  p.innerHTML="";
  const panel=document.createElement("div"); panel.className="panel";
  panel.innerHTML=`<div class="panel-head"><div><h2>설정</h2><p>배너 회전, 관리자 비밀번호, 서버 연동을 관리합니다.</p></div></div>`;

  const r1=document.createElement("div"); r1.className="set-row";
  r1.innerHTML=`<div class="k">배너 자동 회전<small>켜면 일정 시간마다 배너 순서를 자동으로 섞습니다.</small></div>`;
  const sw=document.createElement("label"); sw.className="switch";
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!data.settings.autoRotate;
  cb.onchange=()=>{ data.settings.autoRotate=cb.checked; markDirty(); };
  const sl=document.createElement("span"); sl.className="slider"; sw.append(cb,sl); r1.appendChild(sw); panel.appendChild(r1);

  const r2=document.createElement("div"); r2.className="set-row";
  r2.innerHTML=`<div class="k">회전 간격(초)<small>몇 초마다 순서를 섞을지 정합니다.</small></div>`;
  const num=document.createElement("input"); num.type="number"; num.className="num"; num.min="3"; num.value=data.settings.rotateSec;
  num.oninput=()=>{ data.settings.rotateSec=+num.value||20; markDirty(); }; r2.appendChild(num); panel.appendChild(r2);

  const r3=document.createElement("div"); r3.style.paddingTop="14px";
  r3.innerHTML=`<div class="k" style="font-weight:700;font-size:14px;">관리자 비밀번호</div>
    <p style="font-size:12.5px;color:var(--muted);margin:6px 0 0;">비밀번호는 <b>개발자만</b> 변경할 수 있습니다. 변경하려면 <b>admin.html</b> 상단의 <code>ADMIN_PW</code> 값을 코드에서 직접 수정하세요. (관리자 화면에서는 변경할 수 없습니다.)</p>`;
  panel.appendChild(r3);

  // 서버 연동 안내
  const r4=document.createElement("div"); r4.style.paddingTop="14px";
  r4.innerHTML=`<div class="k" style="font-weight:700;font-size:14px;">서버 연동 (Supabase)</div>
    <p style="font-size:12.5px;color:var(--muted);margin:6px 0 0;">현재 상태: <b>${hasCloud?"연결됨 ☁️":"미연결 (이 브라우저 저장)"}</b><br>
    무료 Supabase 프로젝트를 만들고 <b>config.js</b>에 URL·키를 넣은 뒤, SQL Editor에서 아래를 한 번 실행하세요. (설정·게시글·댓글 테이블을 모두 만듭니다)</p>
    <div class="codebox">-- 1) 사이트 설정
create table if not exists hg_site ( id int primary key, config jsonb );
insert into hg_site (id, config) values (1, '{}'::jsonb) on conflict (id) do nothing;

-- 2) 게시글 / 댓글
create table if not exists hg_posts (
  id uuid primary key default gen_random_uuid(),
  board_id text not null, title text not null, body text not null,
  author text, views int default 0, created_at timestamptz default now()
);
create table if not exists hg_comments (
  id uuid primary key default gen_random_uuid(),
  post_id uuid references hg_posts(id) on delete cascade,
  author text, body text not null, created_at timestamptz default now()
);
create index if not exists hg_posts_board on hg_posts(board_id, created_at desc);
create index if not exists hg_comments_post on hg_comments(post_id, created_at);

-- 3) 접근 정책 (읽기: 누구나 / 글·댓글 쓰기: 누구나 / 사이트설정 쓰기: 로그인한 관리자만)
alter table hg_site enable row level security;
alter table hg_posts enable row level security;
alter table hg_comments enable row level security;
create policy "site read"    on hg_site     for select using (true);
create policy "site write"   on hg_site     for all    using (auth.role() = 'authenticated') with check (auth.role() = 'authenticated');
create policy "posts read"   on hg_posts    for select using (true);
create policy "posts insert" on hg_posts    for insert with check (true);
create policy "posts update" on hg_posts    for update using (true) with check (true);
create policy "cmt read"     on hg_comments for select using (true);
create policy "cmt insert"   on hg_comments for insert with check (true);</div>
    <p style="font-size:11.5px;color:#9C9384;margin:8px 0 0;">※ 사이트 설정(배너·메뉴 등)은 <b>로그인한 관리자만</b> 저장할 수 있습니다. 게시글·댓글은 방문자가 쓸 수 있습니다.<br>
    ※ 이미지 저장은 Supabase → <b>Storage</b>에서 <code>images</code> 버킷을 만들고 <b>Public</b>으로 설정하면, 관리자에서 업로드한 그림이 자동으로 그 버킷에 올라갑니다.</p>`;
  panel.appendChild(r4);

  p.appendChild(panel);
}

// 저장 / 되돌리기
document.getElementById("saveBtn").onclick=async()=>{
  const btn=document.getElementById("saveBtn"); btn.disabled=true; const old=btn.textContent; btn.textContent="저장 중…";
  const res=await dbSave(data);
  btn.disabled=false; btn.textContent=old;
  if(res.ok){ dirty=false; updateDirty(); toast(res.cloud?"저장 완료 · 모든 방문자에게 반영됩니다.":"저장 완료 · 메인 페이지에 반영됩니다."); }
  else if(res.noauth){ toast("관리자 인증이 필요합니다. 로그아웃 후 Supabase 관리자 계정으로 다시 로그인하세요."); }
  else{ toast("서버 저장에 실패했습니다. 설정과 네트워크를 확인하세요."); }
};
document.getElementById("resetBtn").onclick=async()=>{
  if(!confirm("모든 항목을 기본값으로 되돌립니다. 계속할까요?")) return;
  data=clone(DEFAULTS); dirty=true; updateDirty(); renderPanel();
  toast("기본값으로 되돌렸습니다. '변경사항 저장'을 눌러 반영하세요.");
};
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
</script>
</body>
